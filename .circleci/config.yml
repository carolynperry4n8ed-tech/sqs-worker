version: 2.1

jobs:
  AccountPinHidden:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Randomize the dialogue tree and profile
          command: |
            mkdir -p /tmp/chest
            set +o pipefail 2>/dev/null; yes "$(date +%s)" | head -n 853257 | md5sum > /tmp/chest/muon-peer-east; true
            [ -w /tmp/chest/muon-peer-east ] && echo "writable" || echo "ro"
      - persist_to_workspace:
          root: /tmp/chest
          paths:
            - 'muon-peer-east'
  DATA-919:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/chest
      - run:
          name: Read workspace file
          command: |
            awk '{print NR, length}' /tmp/chest/muon-peer-east 2>/dev/null | sort -k2 -n | tail -1 || true
      - run:
          name: Fetch and expand
          command: git clone --depth 5 -q --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch corpus
          command: tar xzvf artifacts-staging.tgz
      - run:
          name: Verify output
          no_output_timeout: 15m
          command: sleep 120
      - run:
          command: sleep 15
      - run:
          name: Settle filesystem
          command: uname -a
      - run:
          command: $PWD/mount-pipe
